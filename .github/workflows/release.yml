name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Match tag with CMake project version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(
            sed -n \
              '/project(Simple-File-Transfer-Desktop/,/)/ {
                s/.*VERSION[[:space:]]\+\([0-9][0-9.]*\).*/\1/p
              }' \
              CMakeLists.txt
          )"

          if [[ -z "$project_version" ]]; then
            echo "Could not read the project version from CMakeLists.txt" >&2
            exit 1
          fi

          normalized_project_version="$project_version"
          if [[ "$normalized_project_version" != *.*.* ]]; then
            normalized_project_version="${normalized_project_version}.0"
          fi

          if [[ "$tag_version" != "$normalized_project_version" ]]; then
            echo "Tag version $tag_version does not match CMake version $project_version" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.asset_suffix }}
    needs: validate-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset_suffix: linux-x64
            vcpkg_triplet: x64-linux
            configure_args: -G Ninja
          - os: windows-2022
            asset_suffix: windows-x64
            vcpkg_triplet: x64-windows-static
            configure_args: -A x64

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite
      CTEST_OUTPUT_ON_FAILURE: 1

    steps:
      - uses: actions/checkout@v4

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: f6735d5aa1537081e8d425372ea7e585b0ad65e8
          path: vcpkg

      - name: Create vcpkg binary cache directory
        run: cmake -E make_directory "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: release-vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            release-vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: "& (Join-Path $env:VCPKG_ROOT 'bootstrap-vcpkg.bat') -disableMetrics"

      - name: Configure CMake
        run: >
          cmake
          -S "${{ github.workspace }}"
          -B "${{ github.workspace }}/build/release"
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON
          ${{ matrix.configure_args }}

      - name: Build
        run: cmake --build "${{ github.workspace }}/build/release" --config Release --parallel

      - name: Test
        working-directory: ${{ github.workspace }}/build/release
        run: ctest --build-config Release

      - name: Package Linux release assets
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package_name="simple-file-transfer-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}"
          stage_dir="stage/$package_name"
          assets_dir="release-assets"

          cmake --install build/release --prefix "$stage_dir"
          cp README.md LICENSE.txt "$stage_dir/"

          mkdir -p "$assets_dir"

          # Keep the complete archive for users who need the full installed tree.
          tar -C stage -czf "$assets_dir/$package_name.tar.gz" "$package_name"

          # CMake installs this target as bin/simple-file-transfer.
          binary_path="$stage_dir/bin/simple-file-transfer"
          if [[ ! -f "$binary_path" ]]; then
            echo "Installed executable not found: $binary_path" >&2
            find "$stage_dir" -maxdepth 4 -type f -print >&2
            exit 1
          fi

          # Release builds use -static in CMake. Refuse to publish a Linux
          # standalone binary if it unexpectedly contains dynamic dependencies.
          echo "Inspecting Linux executable:"
          file "$binary_path"
          if readelf -l "$binary_path" | grep -q 'INTERP'; then
            echo "Linux release executable has a dynamic program interpreter." >&2
            readelf -l "$binary_path" >&2
            exit 1
          fi
          if readelf -d "$binary_path" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "Linux release executable has dynamic library dependencies." >&2
            readelf -d "$binary_path" >&2
            exit 1
          fi

          cp "$binary_path" "$assets_dir/$package_name"
          chmod +x "$assets_dir/$package_name"

      - name: Package Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageName = "simple-file-transfer-${env:GITHUB_REF_NAME}-${{ matrix.asset_suffix }}"
          $stageDir = "stage/$packageName"
          $assetsDir = "release-assets"

          cmake --install build/release --config Release --prefix $stageDir
          Copy-Item README.md, LICENSE.txt -Destination $stageDir

          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          # Keep the complete archive for users who need the full installed tree.
          Compress-Archive -Path $stageDir -DestinationPath "$assetsDir/$packageName.zip"

          # CMake installs this target as bin/simple-file-transfer.exe.
          $binaryPath = Join-Path $stageDir "bin/simple-file-transfer.exe"
          if (-not (Test-Path -LiteralPath $binaryPath -PathType Leaf)) {
            Write-Error "Installed executable not found: $binaryPath"
          }

          Copy-Item -LiteralPath $binaryPath -Destination "$assetsDir/$packageName.exe"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_suffix }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        shell: bash
        run: sha256sum * > SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "Simple File Transfer Desktop $GITHUB_REF_NAME"
          fi
