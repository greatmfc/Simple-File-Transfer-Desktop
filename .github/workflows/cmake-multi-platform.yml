name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite
      CTEST_OUTPUT_ON_FAILURE: 1

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: ubuntu-gcc
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
            vcpkg_triplet: x64-linux
            configure_args: -G Ninja -DCMAKE_CXX_COMPILER=g++
          - os: ubuntu-24.04
            name: ubuntu-clang
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
            vcpkg_triplet: x64-linux
            configure_args: -G Ninja -DCMAKE_CXX_COMPILER=clang++
          - os: windows-2022
            name: windows-msvc
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl
            vcpkg_triplet: x64-windows-static
            configure_args: -A x64

    steps:
    - uses: actions/checkout@v4

    - name: Checkout vcpkg
      uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: f6735d5aa1537081e8d425372ea7e585b0ad65e8
        path: vcpkg

    - name: Create vcpkg binary cache directory
      run: cmake -E make_directory "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}"

    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-binary-${{ runner.os }}-${{ matrix.name }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-binary-${{ runner.os }}-${{ matrix.name }}-${{ matrix.vcpkg_triplet }}-

    - name: Bootstrap vcpkg
      if: runner.os != 'Windows'
      shell: bash
      run: |
        "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

    - name: Bootstrap vcpkg
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & (Join-Path $env:VCPKG_ROOT 'bootstrap-vcpkg.bat') -disableMetrics

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      env:
        CC: ${{ matrix.c_compiler }}
        CXX: ${{ matrix.cpp_compiler }}
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
        -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_TESTS=ON
        ${{ matrix.configure_args }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}
